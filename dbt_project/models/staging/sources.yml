version: 2

sources:
  - name: berlin_police
    description: "Raw data scraped from the Berlin Police Versammlungsbehörde JSON endpoint"
    schema: public
    tables:
      - name: raw_assemblies
        description: "One row per event as returned by the API. Written only by the scraper."
        columns:
          - name: id
            description: "Internal surrogate key"
          - name: source_id
            description: "The 'id' field from the Berlin Police API — stable identifier per event"
          - name: datum
            description: "Date string as returned by API, e.g. '24.04.2026'"
          - name: thema
            description: "Full German description text of the assembly"
          - name: plz
            description: "Postcode, may be empty string for marches with no fixed location"
          - name: strasse_nr
            description: "Street address and number of the assembly location"
          - name: aufzugsstrecke
            description: "Route description for marches; empty for stationary assemblies"
